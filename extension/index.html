<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openClick</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="toolbar" aria-label="openClick tools">
    <button id="add-layer" class="tool" type="button" title="Add Adjustment Layer (Shift+click for one layer across selected clips)" aria-label="Add Adjustment Layer">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3.5 20.5 8 12 12.5 3.5 8Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M3.5 12 12 16.5 20.5 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.5 16 12 20.5 20.5 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 1v5.2M17.4 3.6h5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="nest-clips" class="tool" type="button" title="Nested Clips (Shift+click to nest all selected clips into one, Alt+click to unnest all nested clips)" aria-label="Nested Clips">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3.25" y="4.25" width="17.5" height="15.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="10" y="9.5" width="7.75" height="7" rx="1.2" fill="currentColor"/>
      </svg>
    </button>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
  </nav>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <script src="js/main.js"></script>
</body>
</html>
