<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openClick</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="toolbar" aria-label="openClick tools">
    <button id="add-layer" class="tool" type="button" title="Add Adjustment Layer (Shift+click for one layer across selected clips)" aria-label="Add Adjustment Layer">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3.25" y="5.25" width="17.5" height="13.5" rx="1.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="3.9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M12 8.1a3.9 3.9 0 0 1 0 7.8z" fill="currentColor"/>
      </svg>
    </button>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
    <span class="tool-slot" aria-hidden="true"></span>
  </nav>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="js/main.js"></script>
</body>
</html>
